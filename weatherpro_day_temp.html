          th {

          }

          td {

            padding: 10px 25px;
            text-align: center;
            color: #1b8cc9;
          }

          tbody tr:nth-child(odd) {
            background: white;
          }

          tbody tr:nth-child(even) {
            background: #5b82b922;
          }

          tbody tr:hover {
